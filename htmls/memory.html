<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
            background-color: #f8f8f8;
        }

        h1 {
            color: #800080;
            background-color: #cc75d8;
            padding: 10px;
        }

        button {
            cursor: pointer;
            font-size: 16px;
            margin: 8px;
        }

        .tile {
            font-size: xx-large;
            width: 60px;
            height: 60px;
            line-height: 60px;
            background-color: #800080;
            color: white;
            text-align: center;
        }   

        button {
            font-size: 20px;
            padding: 5px;
        }

        table {
            margin: 0 auto;
        }

        td {
            width: 60px;
            height: 60px;
        }

        .paragraph {
            font-size: 30px;
        }
    </style>
</head>
<body>
    <h1>Welcome to Memory Match</h1>
    <p><button onclick="gameReset()">Reset Game</button></p>
    <div id="gameBoard"></div>
    <br>
    <p class="paragraph"><a href="../index.html">Return</a></p>

    <script>
        let map = [];
        let tile1 = null, tile2 = null;

        const loadMap = (rows, cols) => {
            const numPairs = (rows * cols) / 2;
            let array = [];
            for (let i = 1; i <= numPairs; i++) {
                array.push(i, i);
            }

            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }

            map = [];
            let index = 0;
            for (let r = 0; r < rows; r++) {
                map[r] = [];
                for (let c = 0; c < cols; c++) {
                    map[r][c] = array[index++];
                }
            }

            console.log("Map:", map);
        };

        const makeBoard = (rows, cols) => {
            let output = "<table>";
            for (let r = 0; r < rows; r++) {
                output += "<tr>";
                for (let c = 0; c < cols; c++) {
                    output += `<td><button class='tile' id='r${r}_c${c}' onclick='process(${r}, ${c})'></button></td>`;
                }
                output += "</tr>";
            }
            output += "</table>";
            document.getElementById("gameBoard").innerHTML = output;
        };

        const gameReset = () => {
            tile1 = null;
            tile2 = null;
            loadMap(4, 4);
            makeBoard(4, 4);
        };

        const process = (row, col) => {
            const clickedTile = document.getElementById(`r${row}_c${col}`);

            if (clickedTile.innerHTML !== "") return;

            if (!tile1) {
                tile1 = clickedTile;
                clickedTile.innerHTML = map[row][col];
            }
            
            else if (!tile2) {
                tile2 = clickedTile;
                clickedTile.innerHTML = map[row][col];
                setTimeout(checkMatch, 1000);
            }
        };

        const checkMatch = () => {
            if (tile1.innerHTML === tile2.innerHTML) {
                tile1.hidden = true;
                tile2.hidden = true;
            } else {
                tile1.innerHTML = "";
                tile2.innerHTML = "";
            }
            tile1 = null;
            tile2 = null;
        };

        window.onload = gameReset;
    </script>
</body>
</html>
